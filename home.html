<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS Grand Events - Home</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .home-hero {
            width: 100%;
            height: 100vh;
            background: url('2026-01-19.webp') center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .home-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
        }

        .home-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
        }

        .home-content h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .home-content p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .home-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .home-btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <h1>SS Grand Events</h1>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="login.html" class="login-btn">Employee Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="home-hero">
        <div class="home-content">
            <h1>SS Grand Events</h1>
            <p>Creating Unforgettable Moments</p>
            <div class="home-buttons">
                <a href="index.html#services" class="home-btn btn-primary">Explore Services</a>
                <a href="index.html#contact" class="home-btn btn-secondary">Get In Touch</a>
            </div>
        </div>
    </section>

    <script src="config.js"></script>
</body>
</html>
